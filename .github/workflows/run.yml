name: 刷步数

on:
  schedule:
    - cron: '30 14 * * *'   # 北京时间每天 22:30（UTC 14:30）
  workflow_dispatch:         # 保留手动运行功能

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pytz pycryptodome

      - name: Run step update
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          python main.py
